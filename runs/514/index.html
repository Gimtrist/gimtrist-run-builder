<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chess</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>

<!-- Waiting overlay -->
<div id="waiting-screen">
  <div class="waiting-box">
    <div class="spinner"></div>
    <p id="waiting-msg">Connecting…</p>
  </div>
</div>

<!-- Outcome overlay -->
<div id="outcome-screen" class="hidden">
  <div class="outcome-box">
    <div id="outcome-icon"></div>
    <p id="outcome-msg"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>
</div>

<!-- Promotion picker -->
<div id="promotion-screen" class="hidden">
  <div class="promo-box">
    <p>Promote pawn to:</p>
    <div id="promo-pieces"></div>
  </div>
</div>

<!-- Main game -->
<div id="game" class="hidden">
  <div class="game-layout">

    <!-- Board column -->
    <div class="board-col">
      <div class="player-panel" id="panel-top">
        <div class="avatar">♟</div>
        <div class="player-info">
          <span class="player-name" id="name-top">Opponent</span>
          <div class="captured" id="captured-top"></div>
        </div>
      </div>

      <div class="board-wrap">
        <div class="coords-ranks" id="coords-ranks"></div>
        <div id="board"></div>
        <div class="coords-files" id="coords-files"></div>
      </div>

      <div class="player-panel" id="panel-bottom">
        <div class="avatar">♙</div>
        <div class="player-info">
          <span class="player-name" id="name-bottom">You</span>
          <div class="captured" id="captured-bottom"></div>
        </div>
      </div>
    </div>

    <!-- Side panel -->
    <div class="side-panel">
      <div class="status-bar" id="status-bar">Waiting for move…</div>
      <div class="moves-header">Moves</div>
      <div class="moves-list" id="moves-list"></div>
      <div class="side-buttons">
        <button class="btn-resign" id="btn-resign">Resign</button>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="/static/js/game.js"></script>
</body>
</html>
