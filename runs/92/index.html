    <!--
      The window paints before react mounts, and until it does the only styles that exist are these.
      Without them the webview shows its own white default for as long as the bundle takes to boot,
      which on an otherwise dark application reads as a flash.
    -->
    <style>
      html {
        --preload-surface: #161719;
        --preload-paper: #1e2023;
        --preload-divider: rgba(220, 228, 235, 0.08);

        background-color: var(--preload-surface);
        color-scheme: dark;
      }

      html[data-color-scheme="light"] {
        --preload-surface: #eef0f2;
        --preload-paper: #f7f8fa;
        --preload-divider: rgba(20, 28, 35, 0.1);

        color-scheme: light;
      }

      body {

      }
    </style>

    <style>

        flex-direction: column;

      .preload-title-bar,
      .preload-status-bar,

        box-sizing: border-box;
        flex-shrink: 0;
        border: 0 solid var(--preload-divider);
        background-color: var(--preload-paper);
      }

      .preload-title-bar {
        height: 36px;
        border-bottom-width: 1px;
      }

      .preload-middle {
        display: flex;
        flex-grow: 1;
        min-height: 0;
      }

      .preload-rail {
        width: 44px;
        border-right-width: 1px;
      }

      .preload-rail-right {
        border-right-width: 0;
        border-left-width: 1px;
      }

      .preload-canvas {
        flex-grow: 1;
      }

      .preload-status-bar {
