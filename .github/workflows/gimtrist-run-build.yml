name: Gimtrist Run Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Gimtrist build identifier
        required: true
        type: string
      target_id:
        description: Gimtrist target identifier
        required: true
        type: string
      source_repo:
        description: Source repository URL
        required: true
        type: string
      source_repo_full_name:
        description: Source owner/repository
        required: true
        type: string
      source_ref:
        description: Source branch, tag, or commit
        required: true
        default: HEAD
        type: string
      runner_profile:
        description: Gimtrist Run profile
        required: true
        type: string
      project_path:
        description: Project path inside the source repository
        required: false
        default: .
        type: string
      callback_url:
        description: WordPress result endpoint
        required: true
        type: string
      callback_nonce:
        description: One-time result nonce
        required: true
        type: string
      pages_base_url:
        description: Configured GitHub Pages base URL
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gimtrist-run-${{ inputs.target_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUILD_ID: ${{ inputs.build_id }}
      TARGET_ID: ${{ inputs.target_id }}
      SOURCE_REPO: ${{ inputs.source_repo }}
      SOURCE_REPO_FULL_NAME: ${{ inputs.source_repo_full_name }}
      SOURCE_REF: ${{ inputs.source_ref }}
      RUNNER_PROFILE: ${{ inputs.runner_profile }}
      PROJECT_PATH: ${{ inputs.project_path }}
      CALLBACK_URL: ${{ inputs.callback_url }}
      CALLBACK_NONCE: ${{ inputs.callback_nonce }}
      PAGES_BASE_URL: ${{ inputs.pages_base_url }}
      GIMTRIST_RUN_CALLBACK_SECRET: ${{ secrets.GIMTRIST_RUN_CALLBACK_SECRET }}

    steps:
      - name: Check out Builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare common toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq unzip zip rsync cmake ninja-build
          chmod +x scripts/*.sh

      - name: Build, validate, and publish
        id: run
        shell: bash
        run: |
          set -u
          source_dir="$RUNNER_TEMP/gimtrist-source"
          output_dir="$RUNNER_TEMP/gimtrist-output"
          pages_dir="$RUNNER_TEMP/gimtrist-pages"
          target_path="runs/${TARGET_ID}"
          profile="$RUNNER_PROFILE"
          project_path="${PROJECT_PATH:-.}"
          failure_stage=""
          error_summary=""
          source_commit=""
          artifact_url=""
          artifact_hash=""
          artifact_bytes="0"
          largest_file_bytes="0"
          log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          write_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          fail_build() {
            failure_stage="$1"
            error_summary="$(printf '%s' "$2" | tr '\r\n' '  ' | cut -c1-1500)"
            write_output status failed
            write_output failure_stage "$failure_stage"
            write_output error_summary "$error_summary"
            write_output source_commit "$source_commit"
            write_output artifact_url ""
            write_output artifact_hash ""
            write_output artifact_bytes "$artifact_bytes"
            write_output largest_file_bytes "$largest_file_bytes"
            write_output log_url "$log_url"
            exit 0
          }

          rm -rf "$source_dir" "$output_dir" "$pages_dir"
          mkdir -p "$output_dir"

          if [[ "$profile" == "self_test" ]]; then
            profile="static_web"
            source_dir="$GITHUB_WORKSPACE/fixtures/static"
            project_path="."
            source_commit="${GITHUB_SHA}"
          else
            failure_stage="source-checkout"
            clone_url="$SOURCE_REPO"
            if [[ -z "$clone_url" ]]; then
              clone_url="https://github.com/${SOURCE_REPO_FULL_NAME}.git"
            fi
            if ! git clone --filter=blob:none "$clone_url" "$source_dir" >/tmp/gtr-clone.log 2>&1; then
              fail_build "$failure_stage" "$(tail -n 30 /tmp/gtr-clone.log)"
            fi
            cd "$source_dir"
            if [[ -n "$SOURCE_REF" && "$SOURCE_REF" != "HEAD" ]]; then
              if ! git fetch --depth=1 origin "$SOURCE_REF" >/tmp/gtr-fetch.log 2>&1; then
                git fetch origin "$SOURCE_REF" >/tmp/gtr-fetch.log 2>&1 || fail_build "$failure_stage" "$(tail -n 30 /tmp/gtr-fetch.log)"
              fi
              git checkout --detach FETCH_HEAD >/tmp/gtr-checkout.log 2>&1 || git checkout "$SOURCE_REF" >/tmp/gtr-checkout.log 2>&1 || fail_build "$failure_stage" "$(tail -n 30 /tmp/gtr-checkout.log)"
            fi
            source_commit="$(git rev-parse HEAD 2>/dev/null || true)"
            cd "$GITHUB_WORKSPACE"
          fi

          failure_stage="build"
          if ! scripts/build.sh "$profile" "$source_dir" "$output_dir" "$project_path" >/tmp/gtr-build.log 2>&1; then
            fail_build "$failure_stage" "$(tail -n 60 /tmp/gtr-build.log)"
          fi

          failure_stage=artifact-preparation
          if ! scripts/prepare-artifact.sh "$output_dir" >/tmp/gtr-prepare.log 2>&1; then
            fail_build "$failure_stage" "$(tail -n 60 /tmp/gtr-prepare.log)"
          fi

          failure_stage="artifact-size"
          max_artifact_bytes=$((900 * 1024 * 1024))
          max_file_bytes=$((95 * 1024 * 1024))
          max_pages_bytes=$((950 * 1024 * 1024))
          artifact_bytes="$(du -sb "$output_dir" | awk '{print $1}')"
          largest_file_bytes="$(find "$output_dir" -type f -printf '%s\n' | sort -nr | head -n1)"
          largest_file_bytes="${largest_file_bytes:-0}"
          if (( artifact_bytes > max_artifact_bytes )); then
            fail_build "$failure_stage" "Artifact is ${artifact_bytes} bytes; maximum is ${max_artifact_bytes}."
          fi
          if (( largest_file_bytes > max_file_bytes )); then
            fail_build "$failure_stage" "Largest artifact file is ${largest_file_bytes} bytes; maximum is ${max_file_bytes}."
          fi

          artifact_hash="$(find "$output_dir" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"

          failure_stage="publication"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages >/tmp/gtr-pages-fetch.log 2>&1 || fail_build "$failure_stage" "$(tail -n 30 /tmp/gtr-pages-fetch.log)"
          git worktree add --detach "$pages_dir" origin/gh-pages >/tmp/gtr-worktree.log 2>&1 || fail_build "$failure_stage" "$(tail -n 30 /tmp/gtr-worktree.log)"
          rm -rf "$pages_dir/$target_path"
          mkdir -p "$pages_dir/$target_path"
          cp -a "$output_dir/." "$pages_dir/$target_path/"
          pages_bytes="$(du -sb "$pages_dir" | awk '{print $1}')"
          if (( pages_bytes > max_pages_bytes )); then
            fail_build "$failure_stage" "GitHub Pages tree would be ${pages_bytes} bytes; maximum is ${max_pages_bytes}."
          fi

          cd "$pages_dir"
          git config user.name "gimtrist-run-builder"
          git config user.email "gimtrist-run-builder@users.noreply.github.com"
          git add -A "$target_path"
          if ! git diff --cached --quiet; then
            git commit -m "Publish Gimtrist Run target ${TARGET_ID}" >/tmp/gtr-pages-commit.log 2>&1 || fail_build "$failure_stage" "$(tail -n 30 /tmp/gtr-pages-commit.log)"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:gh-pages >/tmp/gtr-pages-push.log 2>&1; then
                pushed=1
                break
              fi
              git fetch origin gh-pages >/tmp/gtr-pages-refetch.log 2>&1 || true
              git rebase origin/gh-pages >/tmp/gtr-pages-rebase.log 2>&1 || { git rebase --abort >/dev/null 2>&1 || true; }
            done
            [[ "$pushed" == "1" ]] || fail_build "$failure_stage" "$(tail -n 40 /tmp/gtr-pages-push.log)"
          fi

          artifact_url="${PAGES_BASE_URL%/}/${target_path}/"
          write_output status success
          write_output failure_stage ""
          write_output error_summary ""
          write_output source_commit "$source_commit"
          write_output artifact_url "$artifact_url"
          write_output artifact_hash "$artifact_hash"
          write_output artifact_bytes "$artifact_bytes"
          write_output largest_file_bytes "$largest_file_bytes"
          write_output log_url "$log_url"

      - name: Report result to Gimtrist
        if: always()
        shell: bash
        env:
          RESULT_STATUS: ${{ steps.run.outputs.status }}
          FAILURE_STAGE: ${{ steps.run.outputs.failure_stage }}
          ERROR_SUMMARY: ${{ steps.run.outputs.error_summary }}
          SOURCE_COMMIT: ${{ steps.run.outputs.source_commit }}
          ARTIFACT_URL: ${{ steps.run.outputs.artifact_url }}
          ARTIFACT_HASH: ${{ steps.run.outputs.artifact_hash }}
          ARTIFACT_BYTES: ${{ steps.run.outputs.artifact_bytes }}
          LARGEST_FILE_BYTES: ${{ steps.run.outputs.largest_file_bytes }}
          LOG_URL: ${{ steps.run.outputs.log_url }}
        run: |
          set -euo pipefail
          status="${RESULT_STATUS:-failed}"
          stage="${FAILURE_STAGE:-workflow}"
          error_summary="${ERROR_SUMMARY:-Workflow did not produce a result.}"
          log_url="${LOG_URL:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
          payload="$(jq -nc \
            --arg build_id "$BUILD_ID" \
            --arg callback_nonce "$CALLBACK_NONCE" \
            --arg status "$status" \
            --arg source_commit "${SOURCE_COMMIT:-}" \
            --arg artifact_url "${ARTIFACT_URL:-}" \
            --arg artifact_hash "${ARTIFACT_HASH:-}" \
            --argjson artifact_bytes "${ARTIFACT_BYTES:-0}" \
            --argjson largest_file_bytes "${LARGEST_FILE_BYTES:-0}" \
            --arg stage "$stage" \
            --arg error "$error_summary" \
            --arg log_url "$log_url" \
            --arg external_job_id "$GITHUB_RUN_ID" \
            '{build_id:$build_id,callback_nonce:$callback_nonce,status:$status,source_commit:$source_commit,artifact_url:$artifact_url,artifact_hash:$artifact_hash,artifact_bytes:$artifact_bytes,largest_file_bytes:$largest_file_bytes,stage:$stage,failure_stage:$stage,error:$error,error_summary:$error,log_url:$log_url,external_job_id:$external_job_id}')"
          signature="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$GIMTRIST_RUN_CALLBACK_SECRET" -hex | awk '{print $NF}')"
          curl --fail --silent --show-error --retry 3 \
            -H 'Content-Type: application/json' \
            -H "X-Gimtrist-Run-Signature: sha256=${signature}" \
            --data-binary "$payload" \
            "$CALLBACK_URL"

      - name: Mark failed build
        if: ${{ always() && steps.run.outputs.status != 'success' }}
        shell: bash
        run: exit 1
